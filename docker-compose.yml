# Cibiti LAN bundle.
#
# Development (infrastructure only — run the app with `npm run dev` / `npm run worker`):
#   docker compose up -d db redis storage
#
# Full LAN server (app + worker + infrastructure):
#   docker compose --profile lan up -d --build
#
# Host ports are configurable so the stack can coexist with native Postgres/Redis.

x-app-env: &app-env
  DATABASE_URL: postgresql://cibiti:${POSTGRES_PASSWORD:-cibiti}@db:5432/cibiti?schema=public
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
  AUTH_TRUST_HOST: "true"
  STORAGE_ENDPOINT: http://storage:3900
  STORAGE_REGION: garage
  STORAGE_BUCKET: ${STORAGE_BUCKET:-cibiti}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cibiti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cibiti}
      POSTGRES_DB: cibiti
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cibiti"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  storage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET:-cibiti}
    ports:
      - "${STORAGE_PORT:-3900}:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage

  app:
    profiles: ["lan"]
    build: .
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_PORT:-80}:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  worker:
    profiles: ["lan"]
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  garagedata:
